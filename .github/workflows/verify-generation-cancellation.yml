name: Verify generation cancellation (50 repetitions)

on:
  push:
    branches: [test/verify-generation-cancellation-50]

permissions:
  contents: read

jobs:
  repeat-cancellation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Repeat focused test 50 times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 50); do
            echo "Repetition ${iteration}/50"
            python -m pytest -q tests/test_api_contract.py::test_generation_conflict_and_cancellation_are_explicit
          done
      - name: Review artifact boundaries
        run: python tools/artifact_boundary_review.py --json --strict
