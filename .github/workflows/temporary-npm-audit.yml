name: Temporary verified npm lockfile repair

# One-time, branch-scoped remediation for #500.
# Delete this workflow before opening/merging the production PR.
on:
  push:
    branches: [fix/frontend-npm-advisories-500]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'dovvnloading/Cortex' && github.ref == 'refs/heads/fix/frontend-npm-advisories-500'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate the lockfile from reviewed constraints
        working-directory: frontend
        run: |
          echo 'Using npm 11 to bypass the npm 10 Arborist resolver crash on this lockfile.'
          npx --yes npm@11 install --package-lock-only --ignore-scripts --no-audit || {
            echo '=== NPM DEBUG LOG ==='
            find "$HOME/.npm/_logs" -name '*debug*.log' -type f -print | tail -2 | while read -r log; do tail -80 "$log"; done
            exit 1
          }
      - name: Verify manifest remains unchanged
        run: |
          git diff --exit-code -- frontend/package.json
          git diff --check
      - name: Install and audit exact resolved dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate
          npm ls minimatch zod vite vitest @vitest/mocker eslint typescript-eslint --all
      - name: Verify frontend types lint tests and bundle
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run test:coverage
          npm run build
      - name: Commit regenerated lockfile to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches the reviewed manifest.'
          else
            git commit -m 'fix(deps): regenerate audited frontend lockfile'
            git push origin HEAD:refs/heads/fix/frontend-npm-advisories-500
          fi
