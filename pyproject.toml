[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-backend"
# Read from cortex_backend.__version__; see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Windows-first, local-first desktop assistant backend."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "ollama>=0.4,<1",
    "gguf>=0.13,<1",
    "pydantic>=2.13,<2.14",
    "fastapi>=0.139,<0.142",
    "starlette>=0.40,<2",
    "uvicorn>=0.51,<0.53",
    "httpx>=0.27,<1",
    "pywebview>=6.2,<6.3",
    "Pillow>=12.3,<12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2.3,<3",
    "coverage[toml]>=7.10,<8",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "actionlint-py==1.7.12.25",
    "zizmor==1.30.1",
]

[tool.setuptools.dynamic]
version = { attr = "cortex_backend.__version__" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["cortex_backend*"]

[tool.setuptools.package-data]
cortex_backend = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection intentionally calls these in parameter defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
# backend/cortex_backend/py.typed promises callers that this package is typed.
# This is what makes that promise true rather than decorative.
python_version = "3.10"
# The package, the two entry modules, and the tooling around them. Tests are
# left out on purpose: they are untyped fixtures and doubles, and typing them
# would be a large change unrelated to what ships.
files = ["backend/cortex_backend", "main.py", "app_factory.py", "scripts", "tools"]
mypy_path = ["backend"]
# `scripts` and `tools` are plain directories of scripts, not packages; name
# their modules from the repository root so they cannot collide by basename.
explicit_package_bases = true
# Windows-first: POSIX-only branches are guarded at runtime and carry targeted
# ignores at the call site rather than being silenced wholesale.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = "-ra"
# Hang protection. A test that stops making progress fails after two minutes
# with every thread's stack, instead of holding a CI job until its 30-minute
# limit with nothing to read. "thread" is the only method that works on
# Windows; it ends the whole pytest process, which is the point. pytest's own
# faulthandler fires first so the stacks are in the log before the kill.
timeout = 120
timeout_method = "thread"
faulthandler_timeout = 100

[tool.coverage.run]
# Branch coverage over the shipped package only: tests, tools and scripts are
# not what a user runs. `coverage run -m pytest` is the CI and local entry
# point; pytest-cov is deliberately not used so the measurement has one owner.
branch = true
# A directory, not a package name: the package is put on sys.path by pytest's
# `pythonpath` setting, after coverage has already resolved `source`.
source = ["backend/cortex_backend"]
relative_files = true

[tool.coverage.report]
# One point below the total measured when this gate was added. It only ratchets
# up: raise it in the pull request that adds tests, never lower it to make a
# change pass. Lowering it needs a stated reason in the pull request.
fail_under = 79
skip_covered = true
show_missing = false
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"
