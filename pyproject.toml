[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-backend"
# Read from cortex_backend.__version__; see [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Windows-first, local-first desktop assistant backend."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "ollama>=0.4,<1",
    "gguf>=0.13,<1",
    "pydantic>=2.13,<2.14",
    "fastapi>=0.139,<0.142",
    "starlette>=0.40,<2",
    "uvicorn>=0.51,<0.53",
    "httpx>=0.27,<1",
    "pywebview>=6.2,<6.3",
    "Pillow>=12.3,<12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[tool.setuptools.dynamic]
version = { attr = "cortex_backend.__version__" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["cortex_backend*"]

[tool.setuptools.package-data]
cortex_backend = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection intentionally calls these in parameter defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
# backend/cortex_backend/py.typed promises callers that this package is typed.
# This is what makes that promise true rather than decorative.
python_version = "3.10"
files = ["backend/cortex_backend"]
mypy_path = ["backend"]
# Windows-first: POSIX-only branches are guarded at runtime and carry targeted
# ignores at the call site rather than being silenced wholesale.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = "-ra"
