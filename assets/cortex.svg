<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Cortex</title>
  <desc id="desc">A precise orange aperture mark on a graphite field.</desc>
  <defs>
    <linearGradient id="field" x1="28" y1="20" x2="228" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24272b" />
      <stop offset="1" stop-color="#141619" />
    </linearGradient>
    <linearGradient id="mark" x1="54" y1="47" x2="201" y2="207" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9a5c" />
      <stop offset="0.46" stop-color="#ff7540" />
      <stop offset="1" stop-color="#e84f27" />
    </linearGradient>
    <linearGradient id="core" x1="108" y1="102" x2="151" y2="153" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f7f4" />
      <stop offset="1" stop-color="#aeb4ba" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="50" fill="#0d0f11" />
  <rect x="10" y="10" width="236" height="236" rx="44" fill="url(#field)" stroke="#3b3f44" stroke-width="3" />

  <!-- One continuous, hard-edged aperture: a deliberate C without circuitry or stock tech motifs. -->
  <path
    d="M192 55H112c-46 0-83 37-83 73s37 73 83 73h80v-33h-78c-26 0-47-18-47-40s21-40 47-40h78Z"
    fill="url(#mark)"
    filter="url(#shadow)"
  />

  <!-- The cut-through core gives the mark a clear focal point at small sizes. -->
  <path d="m128 99 29 17v24l-29 17-29-17v-24Z" fill="#0d0f11" fill-opacity="0.62" />
  <path d="m128 106 20 12v16l-20 12-20-12v-16Z" fill="url(#core)" />
  <circle cx="128" cy="126" r="6" fill="#202327" />
</svg>
